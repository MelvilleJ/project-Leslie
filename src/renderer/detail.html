<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Page itself loads no remote resources; the <webview> guest is separate. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <title>LESLIE — Details</title>
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="detail.css" />
</head>
<body>
  <header id="bar">
    <span id="title">Detailed response</span>
    <div id="bar-actions">
      <input type="color" id="accent" value="#9b7bff" title="Theme colour" />
      <button id="back" class="hidden" title="Back to the answer">← Back</button>
    </div>
  </header>

  <main id="content"></main>

  <webview id="web" class="hidden" allowpopups></webview>

  <script src="markdown.js"></script>
  <script src="detail.js"></script>
</body>
</html>
