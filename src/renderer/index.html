<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Lock down what the renderer is allowed to load. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; img-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
  <title>LESLIE</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="stage">
    <div id="thought" class="thought hidden" title="Click to collapse / expand">
      <div id="thought-text"></div>
    </div>

    <div id="bubble" class="bubble hidden">
      <div id="bubble-text"></div>
    </div>

    <div id="confirm" class="bubble confirm hidden">
      <div id="confirm-text"></div>
      <div id="confirm-actions">
        <button id="confirm-yes" type="button">Approve</button>
        <button id="confirm-no" type="button">Deny</button>
      </div>
    </div>

    <div id="companion" class="sprite"></div>

    <div id="input-row">
      <input id="input" type="text" autocomplete="off" spellcheck="false"
             placeholder="Say something… (/help)" />
      <button id="agent-toggle" title="Mode: click to switch (Chat → Plan → Agent)">💬</button>
      <button id="mic" title="Dictate (push to talk)">🎤</button>
      <button id="settings-btn" title="Settings &amp; past conversations">⚙</button>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
