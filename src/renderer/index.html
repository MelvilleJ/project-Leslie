<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; img-src 'self' leslie-sprite:; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src https://cdnjs.cloudflare.com; script-src 'self';" />
  <title>LESLIE</title>
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        integrity="sha384-PPIZEGYM1v8zp5Py7UjFb79S58UeqCL9pYVnVPURKEqvioPROaVAJKKLzvH2rDnI"
        crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="theme.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="panel">
    <section id="chat">
      <main id="transcript" aria-live="polite"></main>

      <div id="composer">
        <div id="mention-menu" class="hidden" role="listbox"></div>
        <div id="command-menu" class="hidden" role="listbox"></div>
        <div id="picker-menu" class="hidden" role="listbox"></div>
        <div id="attachments" class="hidden"></div>
        <div id="input-row">
          <textarea id="input" rows="1" autocomplete="off" spellcheck="false"
                    placeholder="Say something… (@ files, /help)"></textarea>
          <div id="input-actions">
            <button id="agent-toggle" title="Mode: click to switch (Chat → Plan → Agent)"><i class="fa-solid fa-comment" aria-hidden="true"></i></button>
            <button id="auto-toggle" title="Auto mode: off — click to run safe commands without asking"><i class="fa-solid fa-forward" aria-hidden="true"></i></button>
            <button id="mic" title="Dictate (push to talk)"><i class="fa-solid fa-microphone" aria-hidden="true"></i></button>
            <button id="settings-btn" title="Settings &amp; past conversations"><i class="fa-solid fa-gear" aria-hidden="true"></i></button>
            <div id="pi-bar">
              <button id="pi-model" class="pi-chip" title="Model — click to switch"></button>
              <button id="pi-thinking" class="pi-chip hidden" title="Thinking level — click to change"></button>
              <button id="pi-context" class="pi-chip hidden" title="Context used — click for session stats"></button>
              <span id="pi-queue" class="pi-chip hidden" title="Queued messages"></span>
            </div>
            <button id="send-btn" title="Send"><i class="fa-solid fa-arrow-up" aria-hidden="true"></i></button>
          </div>
        </div>
        <div id="pi-status" class="hidden"></div>
      </div>
    </section>

    <aside id="stage">
      <button id="rec-indicator" class="hidden" title="Recording the screen — click to stop"></button>
      <div id="guest-indicator" class="hidden" title="Someone other than the owner is at the desk: commands, files and memories are off">Guest mode</div>
      <div id="avatar" class="sprite"></div>
      <div id="status"></div>
    </aside>
  </div>

  <script src="markdown.js"></script>
  <script src="dialog.js"></script>
  <script src="researchSynapse.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
