[project]
name = "leslie-vision"
version = "0.1.0"
description = "Camera presence detection and face recognition sidecar for LESLIE"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.10",
]

# Install exactly one: both provide the onnxruntime module.
[project.optional-dependencies]
cuda = ["onnxruntime-gpu[cuda,cudnn]>=1.21"]
cpu = ["onnxruntime>=1.21"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
leslie-vision = "leslie_vision.server:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["leslie_vision"]
